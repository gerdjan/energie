name: Data ophalen (weer en Frank-prijzen)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/dagen.csv"
      - ".github/workflows/fetch-data.yml"
  schedule:
    # UTC. 05:00 ochtendrun; 14:30 en 16:30 UTC liggen in zomer en winter na ca. 15:00 NL-tijd
    - cron: "0 5 * * *"
    - cron: "30 14 * * *"
    - cron: "30 16 * * *"

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests
        run: python3 scripts/test_parse.py

      - name: Diagnose verbinding weer-API
        continue-on-error: true
        run: |
          mkdir -p data/raw
          {
            date -u
            echo "--- DNS"; getent ahosts api.open-meteo.com | head -4
            echo "--- curl IPv4 forecast"; curl -4 -sS -m 20 -o /dev/null -w "%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" "https://api.open-meteo.com/v1/forecast?latitude=52.7&longitude=6.19&hourly=temperature_2m&forecast_days=1" 2>&1
            echo "--- curl IPv6 forecast"; curl -6 -sS -m 20 -o /dev/null -w "%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" "https://api.open-meteo.com/v1/forecast?latitude=52.7&longitude=6.19&hourly=temperature_2m&forecast_days=1" 2>&1
            echo "--- curl archive"; curl -sS -m 20 -o /dev/null -w "%{http_code} total=%{time_total}\n" "https://archive-api.open-meteo.com/v1/archive?latitude=52.7&longitude=6.19&start_date=2026-11-01&end_date=2026-11-02&hourly=temperature_2m" 2>&1
            echo "--- curl brightsky"; curl -sS -m 20 -o /dev/null -w "%{http_code} total=%{time_total}\n" "https://api.brightsky.dev/weather?lat=52.7&lon=6.19&date=2026-11-14" 2>&1
          } > data/raw/diag_weer.txt 2>&1 || true

      - name: Gegevens ophalen
        id: fetch
        continue-on-error: true
        run: |
          python3 scripts/fetch_data.py || {
            echo "Eerste poging gaf een fout; nieuwe poging over 90 seconden"
            sleep 90
            python3 scripts/fetch_data.py
          }

      - name: numpy installeren
        run: python3 -m pip install --quiet numpy

      - name: Model kalibreren
        id: calibrate
        continue-on-error: true
        run: python3 scripts/calibrate.py

      - name: Committen (ook na een mislukte fetch, voor status.json)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Data bijgewerkt $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Mislukken zichtbaar maken
        if: steps.fetch.outcome == 'failure' || steps.calibrate.outcome == 'failure'
        run: |
          echo "Ophalen is (deels) mislukt, zie data/status.json"
          exit 1
