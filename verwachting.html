<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b63">
<title>Verwachting energiekosten</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d7dee4;--acc:#0b6b63;--accbg:#dff1ee;--good:#1b8a4b;--bad:#c2410c;--warn:#8a5a00;--warnbg:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171e;--card:#18232d;--ink:#e8eef3;--mute:#95a4b1;--line:#2b3946;--acc:#4fd1c0;--accbg:#143a37;--good:#4ade80;--bad:#fb923c;--warn:#f5c97a;--warnbg:#3a2e12}}
:root[data-theme="dark"]{--bg:#0f171e;--card:#18232d;--ink:#e8eef3;--mute:#95a4b1;--line:#2b3946;--acc:#4fd1c0;--accbg:#143a37;--good:#4ade80;--bad:#fb923c;--warn:#f5c97a;--warnbg:#3a2e12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
nav{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
nav a{color:var(--acc);font-size:.9rem}
h1{font-size:1.05rem;font-weight:600;color:var(--mute);margin:0}
h2{font-size:1rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.lbl{font-size:.85rem;color:var(--mute)}
.big{font-size:clamp(2.6rem,13vw,3.8rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.band{color:var(--mute);font-size:.95rem}
.rows{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:.95rem}
.rows span:first-child{color:var(--mute)}
.note{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.alert{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
label{display:block;font-size:.8rem;color:var(--mute)}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
input:focus,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg{width:100%;height:auto;display:block;margin-top:12px}
svg text{fill:var(--mute);font-size:10px}
.sum{font-size:.9rem;margin-top:6px}
details summary{cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:.9rem;color:var(--ink)}
.chk input{width:auto;margin:3px 0 0}
.sched{margin:12px 0 0;padding:0;list-style:none}
.sched li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:.95rem}
.sched li span:first-child{color:var(--mute)}
.tag{font-size:.75rem;color:var(--mute);margin-left:6px}
</style>
</head>
<body>
<main>
<nav><h1>Verwachting energiekosten</h1><a href="index.html">Omrekenen HW naar Frank</a></nav>
<div id="alerts"></div>

<section class="card" aria-live="polite">
  <h2>Vandaag</h2>
  <div class="lbl" id="todayLbl">Verwachte kosten bij Frank</div>
  <div class="big" id="todayBig">–</div>
  <div class="band" id="todayBand"></div>
  <div class="grid">
    <label>Afname tot nu (kWh)<input id="ia" inputmode="decimal" placeholder="optioneel" autocomplete="off"></label>
    <label>Teruglevering (kWh)<input id="ie" inputmode="decimal" placeholder="optioneel" autocomplete="off"></label>
    <label>HW-bedrag (€)<input id="ih" inputmode="decimal" placeholder="optioneel" autocomplete="off"></label>
  </div>
  <div class="rows" id="todayRows"></div>
  <p class="note" id="todayNote"></p>
  <div id="todayChart"></div>
</section>

<section class="card">
  <h2>Morgen</h2>
  <div class="lbl" id="tmLbl">Verwachte kosten bij Frank</div>
  <div class="big" id="tmBig">–</div>
  <div class="band" id="tmBand"></div>
  <div class="rows" id="tmRows"></div>
  <p class="note" id="tmNote"></p>
  <div id="tmChart"></div>
</section>

<section class="card" id="plan">
  <h2>Auto laden: beste uren</h2>
  <div class="lbl">Verwachte kosten voor deze lading</div>
  <div class="big" id="plBig">–</div>
  <div class="band" id="plBand"></div>
  <div class="grid2">
    <label>Te laden (kWh)<input id="pk" inputmode="decimal" value="40" autocomplete="off"></label>
    <label>Laadvermogen (kW)<input id="pw" inputmode="decimal" value="3" autocomplete="off"></label>
  </div>
  <label style="margin-top:8px">Klaar uiterlijk aan het einde van<select id="pd"></select></label>
  <label class="chk"><input type="checkbox" id="pr"><span>Voorzichtig plannen: liever uren waarvan de prijs al vaststaat</span></label>
  <div class="rows" id="plRows"></div>
  <ul class="sched" id="plSched"></ul>
  <div id="plChart"></div>
  <p class="note" id="plNote"></p>
</section>

<section class="card">
  <details>
    <summary>Hoe goed is dit?</summary>
    <div id="about" class="note"></div>
  </details>
</section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var TZ="Europe/Amsterdam";
var eur=new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
var n1=new Intl.NumberFormat("nl-NL",{maximumFractionDigits:1});
var n0=new Intl.NumberFormat("nl-NL",{maximumFractionDigits:0});
var HW_A=0.165,HW_E=0.021;                 // zelfde formule als index.html
var M,P,W,ST,PM={},WM={};

function get(u){return fetch(u+"?v="+Date.now()).then(function(r){if(!r.ok)throw new Error(u+" gaf "+r.status);return r.json()})}
function parseNum(v){v=String(v||"").trim().replace(/\s/g,"");if(!v)return NaN;if(v.indexOf(",")>-1)v=v.replace(/\./g,"").replace(",",".");return Number(v)}
function nlNow(){
  var p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()),o={};
  p.forEach(function(x){o[x.type]=x.value});
  return{date:o.year+"-"+o.month+"-"+o.day,h:+o.hour,m:+o.minute};
}
function addDay(d,n){var x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function sum(a){return a.reduce(function(s,x){return s+x},0)}
function mean(a){return a.length?sum(a)/a.length:NaN}

// ----- model -----
function dayInfo(date){
  var w=W.filter(function(h){return h.t.indexOf(date)===0&&h.temp!=null});
  var p=P.filter(function(h){return h.t.indexOf(date)===0});
  if(w.length<20)return null;
  var rad=w.map(function(h){return h.radiation||0});
  var info={date:date,w:w,T:mean(w.map(function(h){return h.temp})),S:sum(rad)/1000,prices:p,hasPrices:p.length>=23};
  if(info.hasPrices){
    var pr={};p.forEach(function(h){pr[h.t]=h.all_in});
    info.pd=mean(p.map(function(h){return h.all_in}));
    var wr=0,ws=0;w.forEach(function(h){if(pr[h.t]!=null){wr+=pr[h.t]*(h.radiation||0);ws+=(h.radiation||0)}});
    info.pz=ws>0?wr/ws:info.pd;
  }
  return info;
}
function predictVolume(info){
  var a=Math.max(0,M.afname.c0+M.afname.c1*info.T);
  var e=Math.max(0,M.terug.d0+M.terug.d1*info.S+M.terug.d2*a);
  return{a:a,e:e};
}
function cost(a,e,pd,pz){var k=M.kosten;return k.k_p*a*pd-k.k_e*e*pz-k.k_c*a}
function effPrice(p){return M.kosten.k_p*p-M.kosten.k_c}   // wat een kWh afname in het Frank-dagbedrag kost
function sunWord(S){return S<0.8?"grijs":(S<1.8?"wisselend":"zonnig")}

// ----- ui helpers -----
function rows(el,list){el.innerHTML="";list.forEach(function(r){var d=document.createElement("div"),a=document.createElement("span"),b=document.createElement("b");a.textContent=r[0];b.textContent=r[1];d.appendChild(a);d.appendChild(b);el.appendChild(d)})}
function hhmm(h){return String(h).padStart(2,"0")+":00"}
function chart(el,info,fromHour){
  el.innerHTML="";
  if(!info||!info.hasPrices)return;
  var hrs=info.prices.map(function(h){return{h:+h.t.slice(11,13),e:effPrice(h.all_in)}});
  var sel=hrs.filter(function(x){return x.h>=fromHour});
  if(sel.length<3)return;
  var vals=sel.map(function(x){return x.e}),allv=hrs.map(function(x){return x.e}),lo=Math.min(0,Math.min.apply(null,allv)),hi=Math.max.apply(null,allv);
  var sorted=vals.slice().sort(function(a,b){return a-b}),k=Math.min(4,Math.floor(sel.length/3));
  var cut_lo=sorted[k-1],cut_hi=sorted[sorted.length-k];
  var W0=480,H=150,pl=4,pb=16,pt=6,bw=(W0-pl*2)/24,sc=(H-pb-pt)/((hi-lo)||1);
  var s='<svg viewBox="0 0 '+W0+' '+H+'" role="img" aria-label="Prijs per uur">';
  var zero=pt+(hi-0)*sc;
  hrs.forEach(function(x){
    var inRange=x.h>=fromHour,y=pt+(hi-Math.max(0,x.e))*sc,hgt=Math.abs(x.e)*sc;
    if(x.e<0)y=zero;
    var col=!inRange?"var(--line)":(x.e<=cut_lo?"var(--good)":(x.e>=cut_hi?"var(--bad)":"var(--acc)"));
    s+='<rect x="'+(pl+x.h*bw+1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+Math.max(1,hgt).toFixed(1)+'" rx="2" fill="'+col+'"><title>'+hhmm(x.h)+': '+n1.format(x.e*100)+' ct/kWh</title></rect>';
  });
  [0,3,6,9,12,15,18,21].forEach(function(h){s+='<text x="'+(pl+h*bw+2)+'" y="'+(H-3)+'">'+h+'</text>'});
  s+='</svg>';
  // goedkoopste blok van 3 uur
  var best=null;
  for(var i=0;i+2<sel.length;i++){var avg=(sel[i].e+sel[i+1].e+sel[i+2].e)/3;if(best===null||avg<best.avg)best={avg:avg,h:sel[i].h}}
  var t=document.createElement("div");t.innerHTML=s;
  var p=document.createElement("p");p.className="sum";
  if(best)p.textContent="Goedkoopste blok van 3 uur: "+hhmm(best.h)+" tot "+hhmm(best.h+3)+", gemiddeld "+n1.format(best.avg*100)+" ct per kWh afname (groen: goedkoopste uren, oranje: duurste).";
  el.appendChild(t);el.appendChild(p);
}

// ----- vandaag -----
function renderToday(){
  var now=nlNow(),info=dayInfo(now.date);
  if(!info){$("todayBig").textContent="–";$("todayNote").textContent="Geen weerdata voor vandaag.";return}
  var v=predictVolume(info),a=parseFloat(parseNum($("ia").value)),e=parseNum($("ie").value),h=parseNum($("ih").value);
  var out=[],rmse=M.onzekerheid.kosten_rmse_zonder_uitbijters||1;
  var prof=M.dagprofiel_afname,fa=0;
  for(var i=0;i<now.h&&i<24;i++)fa+=prof[i];
  if(now.h<24)fa+=prof[now.h]*now.m/60;
  var rad=info.w.map(function(x){return{h:+x.t.slice(11,13),r:x.radiation||0}}),rt=sum(rad.map(function(x){return x.r}));
  var radRem=sum(rad.map(function(x){return x.h>now.h?x.r:(x.h===now.h?x.r*(1-now.m/60):0)}));
  var fe=rt>0?radRem/rt:0;
  var aRem=v.a*(1-fa),eRem=v.e*fe;
  var haveIn=!isNaN(a)&&!isNaN(h);
  if(isNaN(e))e=0;
  out.push(["Afname verwacht hele dag",n0.format(haveIn?a+aRem:v.a)+" kWh"]);
  out.push(["Teruglevering verwacht",n0.format(haveIn?e+eRem:v.e)+" kWh"]);
  out.push(["Weer",n0.format(info.T)+" °C gemiddeld, "+sunWord(info.S)]);
  var total=null,band=rmse;
  if(info.hasPrices){
    var remP=info.prices.filter(function(x){return +x.t.slice(11,13)>=now.h});
    var pRem=remP.length?mean(remP.map(function(x){return x.all_in})):info.pd;
    var wr=0,ws=0;info.w.forEach(function(x){var hh=+x.t.slice(11,13);if(hh>=now.h){var pp=info.prices.filter(function(y){return y.t===x.t})[0];if(pp){wr+=pp.all_in*(x.radiation||0);ws+=(x.radiation||0)}}});
    var pzRem=ws>0?wr/ws:pRem;
    var remCost=cost(aRem,eRem,pRem,pzRem);
    var full=cost(v.a,v.e,info.pd,info.pz);
    if(haveIn){
      var sofar=h-HW_A*a-HW_E*e;
      total=sofar+remCost;
      band=rmse*Math.sqrt(Math.max(0.05,1-fa));
      out.push(["Tot nu toe (uit jouw invoer)",eur.format(sofar)]);
      out.push(["Nog te komen (schatting)",eur.format(remCost)]);
    }else{
      total=full;
      out.push(["Gemiddelde prijs vandaag",n1.format(info.pd*100)+" ct/kWh all-in"]);
    }
    $("todayLbl").textContent=haveIn?"Verwacht totaal vandaag bij Frank":"Verwachte kosten vandaag bij Frank (hele dag)";
  }else{
    $("todayLbl").textContent="Prijzen van vandaag ontbreken";
  }
  $("todayBig").textContent=total===null?"–":eur.format(total);
  $("todayBand").textContent=total===null?"":"ongeveer "+eur.format(total-band)+" tot "+eur.format(total+band);
  rows($("todayRows"),out);
  $("todayNote").textContent=haveIn?"Vul afname en HW-bedrag tot nu toe in. De rest van de dag volgt uit het model. Teruglevering is optioneel.":"Vul onder de titel je afname en HW-bedrag tot nu toe in voor een scherpere verwachting.";
  chart($("todayChart"),info,now.h);
  try{localStorage.setItem("verwachting-"+now.date,JSON.stringify({a:$("ia").value,e:$("ie").value,h:$("ih").value}))}catch(x){}
}

// ----- morgen -----
function renderTomorrow(){
  var now=nlNow(),d=addDay(now.date,1),info=dayInfo(d);
  if(!info){$("tmBig").textContent="–";$("tmNote").textContent="Er is nog geen weerverwachting voor morgen.";return}
  var v=predictVolume(info),rmse=M.onzekerheid.kosten_rmse_zonder_uitbijters||1;
  var list=[["Afname verwacht",n0.format(v.a)+" kWh"],["Teruglevering verwacht",n0.format(v.e)+" kWh"],["Weer",n0.format(info.T)+" °C gemiddeld, "+sunWord(info.S)]];
  if(info.hasPrices){
    var c=cost(v.a,v.e,info.pd,info.pz);
    $("tmBig").textContent=eur.format(c);
    $("tmBand").textContent="ongeveer "+eur.format(c-rmse)+" tot "+eur.format(c+rmse);
    list.push(["Gemiddelde prijs",n1.format(info.pd*100)+" ct/kWh all-in"]);
    $("tmNote").textContent="Gaat uit van een dag zonder auto laden. Met laden komt er al snel 10 tot 20 kWh bij.";
    chart($("tmChart"),info,0);
  }else{
    $("tmBig").textContent="–";$("tmBand").textContent="";
    $("tmLbl").textContent="Prijzen voor morgen nog niet bekend";
    $("tmNote").textContent="Frank publiceert de prijzen voor morgen meestal rond 15:00. Hieronder wel de verwachte afname en teruglevering op basis van het weer.";
  }
  rows($("tmRows"),list);
}


// ----- laadplanner -----
var PM=null;
function dayName(d){return new Date(d+"T12:00:00Z").toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}
function dayNameLong(d){return new Date(d+"T12:00:00Z").toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"})}
function dayDiff(a,b){return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5)}
var PBY=null,KNOWN_DAYS=null;
function indexPrices(){
  PBY={};var cnt={},sums={};
  P.forEach(function(h){PBY[h.t]=h;var d=h.t.slice(0,10);cnt[d]=(cnt[d]||0)+1;sums[d]=(sums[d]||0)+h.market});
  KNOWN_DAYS=Object.keys(cnt).filter(function(d){return cnt[d]>=23}).sort().map(function(d){return{d:d,m:sums[d]/cnt[d]}});
}
function levels(){
  var n=KNOWN_DAYS.length;if(n<30)return null;
  var m=function(k){return mean(KNOWN_DAYS.slice(n-k).map(function(x){return x.m}))};
  return{last:KNOWN_DAYS[n-1].d,L7:m(7),L30:m(30)};
}
function weatherDay(d){
  var w=W.filter(function(h){return h.t.indexOf(d)===0&&h.temp!=null});
  if(w.length<20)return null;
  var wind=w.map(function(h){return h.wind100!=null?h.wind100:(h.wind!=null?h.wind*1.3:null)}).filter(function(x){return x!=null});
  if(!wind.length)return null;
  var rad={};w.forEach(function(h){rad[+h.t.slice(11,13)]=(h.radiation||0)/1000});
  var dow=new Date(d+"T12:00:00Z").getUTCDay();
  return{wm:mean(wind),tm:mean(w.map(function(h){return h.temp})),wk:(dow===0||dow===6)?1:0,rad:rad};
}
function forecastHour(date,h,lv,cache){
  if(!PM||!PM.k)return null;
  var k=Math.min(5,Math.max(1,dayDiff(lv.last,date)));
  var wd=cache[date]===undefined?(cache[date]=weatherDay(date)):cache[date];
  if(!wd)return null;
  var mdl=PM.k[String(k)];if(!mdl)return null;
  var c=mdl.coef,mh=c[h]+c[24]*lv.L7+c[25]*lv.L30+c[26]*wd.wm+c[27]*wd.tm+c[28]*wd.wk+c[29]*(wd.rad[h]||0);
  var cv=PM.omrekening||{btw:0.21,toeslag:0.129};
  var allin=(1+cv.btw)*mh+cv.toeslag;
  return{all_in:allin,sd:M.kosten.k_p*(1+cv.btw)*mdl.sd};
}
function buildSlots(days){
  var now=nlNow(),start=now.m>0?now.h+1:now.h,slots=[],lv=levels(),cache={},missing=0;
  for(var di=0;di<=days;di++){
    var d=addDay(now.date,di);
    for(var h=0;h<24;h++){
      if(di===0&&h<start)continue;
      var t=d+"T"+String(h).padStart(2,"0")+":00",kp=PBY[t],s;
      if(kp){s={all_in:kp.all_in,sd:0,known:true}}
      else if(lv){var f=forecastHour(d,h,lv,cache);if(!f){missing++;continue}s={all_in:f.all_in,sd:f.sd,known:false}}
      else{missing++;continue}
      s.t=t;s.d=d;s.h=h;s.eff=effPrice(s.all_in);s.sde=s.sd;slots.push(s);
    }
  }
  return{slots:slots,missing:missing,hasModel:!!(lv&&PM&&PM.k)};
}
function alloc(chosen,kwh,kw){
  // goedkoopste uren krijgen vol vermogen; het restant komt in het duurste gekozen uur
  var byPrice=chosen.slice().sort(function(a,b){return a.eff-b.eff}),left=kwh;
  byPrice.forEach(function(s){s.e=Math.min(kw,left);left-=s.e});
  return left<-1e-9?0:left;
}
function renderPlanner(){
  var kwh=parseNum($("pk").value),kw=parseNum($("pw").value),days=+$("pd").value,risk=$("pr").checked;
  try{localStorage.setItem("verwachting-laden",JSON.stringify({k:$("pk").value,w:$("pw").value,d:$("pd").value,r:risk}))}catch(x){}
  var big=$("plBig"),band=$("plBand"),rowsEl=$("plRows"),sched=$("plSched"),note=$("plNote");
  sched.innerHTML="";$("plChart").innerHTML="";rows(rowsEl,[]);band.textContent="";
  if(!(kwh>0)||!(kw>0)){big.textContent="–";note.textContent="Vul het aantal kWh en het laadvermogen in.";return}
  var b=buildSlots(days),slots=b.slots,count=Math.ceil(kwh/kw-1e-9);
  if(slots.length<count){
    big.textContent="–";
    note.textContent="Er zijn te weinig uren met bekende of verwachte prijzen om "+n0.format(kwh)+" kWh te laden. Kies een latere eindtijd of een hoger laadvermogen.";
    return;
  }
  var lam=risk?0.5:0;
  var ranked=slots.slice().sort(function(a,b){return (a.eff+lam*a.sde)-(b.eff+lam*b.sde)});
  var chosen=ranked.slice(0,count);alloc(chosen,kwh,kw);
  var chosenSet={};chosen.forEach(function(s){chosenSet[s.t]=1});
  var total=sum(chosen.map(function(s){return s.e*s.eff})),unc=sum(chosen.map(function(s){return s.e*s.sde}));
  // meteen beginnen: de eerste uren vanaf nu
  var now5=slots.slice(0,count).map(function(s){return{eff:s.eff,e:0}});alloc(now5,kwh,kw);
  var immediate=sum(now5.map(function(s){return s.e*s.eff}));
  var avgAll=kwh*mean(slots.map(function(s){return s.eff}));
  var nKnown=chosen.filter(function(s){return s.known}).length;
  big.textContent=eur.format(total);
  band.textContent=unc>0.005?"ongeveer "+eur.format(Math.max(-99,total-unc))+" tot "+eur.format(total+unc):"op basis van vaststaande prijzen";
  var rl=[["Gemiddelde prijs",n1.format(total/kwh*100)+" ct per kWh"],["Aantal uren",count+" uur ("+nKnown+" met vaste prijs, "+(count-nKnown)+" verwacht)"],
          ["Meteen beginnen",eur.format(immediate)+(immediate>total?" (je bespaart "+eur.format(immediate-total)+")":"")],
          ["Gemiddeld uur in dit tijdvak",eur.format(avgAll)]];
  rows(rowsEl,rl);
  // rooster per dag, aaneengesloten blokken
  var byDay={};chosen.forEach(function(s){(byDay[s.d]=byDay[s.d]||[]).push(s)});
  Object.keys(byDay).sort().forEach(function(d){
    var hs=byDay[d].sort(function(a,b){return a.h-b.h}),blocks=[],cur=null;
    hs.forEach(function(s){if(cur&&s.h===cur.end){cur.end=s.h+1;cur.known=cur.known&&s.known;cur.kwh+=s.e}else{cur={start:s.h,end:s.h+1,known:s.known,kwh:s.e};blocks.push(cur)}});
    var li=document.createElement("li"),a=document.createElement("span"),c=document.createElement("span");
    a.textContent=dayName(d);
    c.textContent=blocks.map(function(x){return hhmm(x.start)+"–"+hhmm(x.end%24===0&&x.end>0?24:x.end).replace("24:00","24:00")+(x.known?"":" ~")}).join(", ");
    li.appendChild(a);li.appendChild(c);sched.appendChild(li);
  });
  // grafiek over alle uren
  var all=slots.map(function(s){return s.eff}),lo=Math.min(0,Math.min.apply(null,all)),hi=Math.max.apply(null,all),Wd=600,H=140,pb=16,pt=6,bw=Wd/slots.length,sc=(H-pb-pt)/((hi-lo)||1),zero=pt+(hi-0)*sc;
  var svg='<svg viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Prijs per uur voor de komende dagen, gekozen uren gemarkeerd">',lastD="";
  slots.forEach(function(s,i){
    var y=pt+(hi-Math.max(0,s.eff))*sc,hg=Math.max(1,Math.abs(s.eff)*sc);if(s.eff<0)y=zero;
    var col=chosenSet[s.t]?"var(--good)":"var(--line)";
    svg+='<rect x="'+(i*bw).toFixed(2)+'" y="'+y.toFixed(1)+'" width="'+Math.max(1,bw-0.6).toFixed(2)+'" height="'+hg.toFixed(1)+'" fill="'+col+'" opacity="'+(s.known?1:0.6)+'"><title>'+dayName(s.d)+" "+hhmm(s.h)+": "+n1.format(s.eff*100)+" ct/kWh"+(s.known?"":" (verwacht)")+'</title></rect>';
    if(s.d!==lastD){lastD=s.d;svg+='<text x="'+(i*bw+2).toFixed(1)+'" y="'+(H-3)+'">'+dayName(s.d).split(" ")[0]+'</text><line x1="'+(i*bw).toFixed(1)+'" x2="'+(i*bw).toFixed(1)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--line)"/>'}
  });
  svg+='</svg>';
  var t=document.createElement("div");t.innerHTML=svg;$("plChart").appendChild(t);
  var txt="Groen: gekozen uren. Lichtere balken: prijzen die nog niet vaststaan (verwachting). Een ~ achter een tijdblok betekent dat minstens één uur daarin een verwachting is. De uren hoeven niet aaneengesloten te zijn, mits je lader kan pauzeren (bijvoorbeeld via Home Assistant).";
  if(!b.hasModel)txt="Er is nog geen prijsmodel beschikbaar, dus alleen uren met vaststaande prijzen zijn meegenomen. "+txt;
  else if(b.missing)txt+=" Voor "+b.missing+" uur ontbreekt een weerverwachting, die zijn niet meegenomen.";
  var q=PM&&M.prijsmodel&&M.prijsmodel.kwaliteit;
  if(q){var pl=q.planner;txt+=" In een terugkijkende test op de laatste "+q.testperiode_dagen+" dagen kostten de uren die dit model koos gemiddeld "+n1.format(pl.model)+" ct kale marktprijs per kWh; het beste achteraf was "+n1.format(pl.optimum_achteraf)+" ct, een gemiddeld uur "+n1.format(pl.gemiddeld_uur)+" ct en meteen beginnen "+n1.format(pl.meteen_beginnen)+" ct."}
  txt+=" Let op: die test gebruikte het werkelijke weer van die dagen alsof het perfect voorspeld was. Met een echte weersverwachting, zeker op 4 tot 5 dagen vooruit, is de uitkomst minder nauwkeurig.";
  txt+=" Kosten zijn de verwachte bijdrage aan het dagbedrag van Frank (eigen zonnestroom op zonnige uren is hier niet in verrekend).";
  note.textContent=txt;
}
function initPlanner(){
  PM=(M&&M.prijsmodel)||null;indexPrices();
  var now=nlNow(),sel=$("pd");sel.innerHTML="";
  for(var i=1;i<=5;i++){var o=document.createElement("option");o.value=i;o.textContent=dayNameLong(addDay(now.date,i));sel.appendChild(o)}
  sel.value="5";
  try{var s=JSON.parse(localStorage.getItem("verwachting-laden"));if(s){if(s.k)$("pk").value=s.k;if(s.w)$("pw").value=s.w;if(s.d)sel.value=s.d;$("pr").checked=!!s.r}}catch(x){}
  ["pk","pw"].forEach(function(i){$(i).addEventListener("input",renderPlanner)});
  sel.addEventListener("change",renderPlanner);$("pr").addEventListener("change",renderPlanner);
  renderPlanner();
}

function about(){
  var el=$("about");el.innerHTML="";
  function p(t){var x=document.createElement("p");x.textContent=t;el.appendChild(x)}
  p("Het model is gekalibreerd op "+M.dagen_in_fit+" dagen, waarvan "+M.dagen_met_frank+" met een echt Frank-bedrag. Afname volgt de buitentemperatuur, teruglevering de zonnestraling en de kosten de uurprijzen van Frank.");
  p("Typische afwijking per dag in een terugkijkende test: ongeveer "+eur.format(M.onzekerheid.kosten_rmse_zonder_uitbijters)+" op dagen zonder auto laden. Dat komt vooral doordat het verbruik per dag sterk wisselt. Met het werkelijke verbruik is de afwijking veel kleiner (ca. 0,34 euro).");
  p("Dagen die ver boven de verwachting lagen en zijn weggelaten uit de afname-fit (waarschijnlijk auto laden): "+(M.uitbijters_afname||[]).join(", ")+".");
  p("Het verdeelpatroon over de uren (voor het deel van de dag dat al voorbij is) is een aanname en niet uit jouw data gehaald.");
}

function alerts(){
  var el=$("alerts");el.innerHTML="";
  function add(t){var d=document.createElement("div");d.className="alert";d.textContent=t;el.appendChild(d)}
  if(ST&&ST.finished){
    var age=(Date.now()-new Date(ST.finished).getTime())/36e5;
    if(age>30)add("De gegevens zijn "+n0.format(age)+" uur oud. Kijk in GitHub bij Actions of de dagelijkse ophaalactie nog draait.");
  }
  if(ST&&ST.sources&&ST.sources.prijzen&&ST.sources.prijzen.approx)add("De prijzen zijn een benadering, omdat Frank niet bereikbaar was.");
  if(ST&&ST.sources&&ST.sources.weer&&ST.sources.weer.ok===false)add("Het weer kon niet worden opgehaald. De weerdata is mogelijk verouderd.");
}

Promise.all([get("data/model.json"),get("data/prijzen.json"),get("data/weer.json"),get("data/status.json")]).then(function(r){
  M=r[0];P=r[1].hours;W=r[2].hourly;ST=r[3];
  try{var s=JSON.parse(localStorage.getItem("verwachting-"+nlNow().date));if(s){$("ia").value=s.a||"";$("ie").value=s.e||"";$("ih").value=s.h||""}}catch(x){}
  ["ia","ie","ih"].forEach(function(i){$(i).addEventListener("input",renderToday)});
  alerts();renderToday();renderTomorrow();initPlanner();about();
}).catch(function(err){
  var d=document.createElement("div");d.className="alert";d.textContent="De gegevens konden niet worden geladen ("+err.message+"). Open deze pagina via de website en niet als los bestand.";$("alerts").appendChild(d);
});
})();
</script>
